name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # These are the anon-tier Supabase URL/key — the same "safe to
          # expose in the built bundle" values README-HOSTINGER.md already
          # ships in the client. Set them once under Settings > Secrets and
          # variables > Actions > Variables (repository variables, not
          # secrets, since they end up in the public client bundle anyway).
          # Never put SUPABASE_SERVICE_ROLE_KEY or LOVABLE_API_KEY here or
          # in any repository variable/secret this workflow can echo.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
